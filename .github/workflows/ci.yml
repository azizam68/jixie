name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ajoutez cette étape pour créer le .env
      - name: Create .env file
        run: |
          echo "PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_TEST_URL }}" >> .env
          echo "PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_TEST_ANON_KEY }}" >> .env

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
